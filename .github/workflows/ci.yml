name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Syntax check
        run: node --check server/index.js server/routes/claude.js server/routes/sheet.js server/routes/pipeline.js server/routes/ingest.js
